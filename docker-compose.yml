services:
  # 1. TimescaleDB (含 PostgreSQL 時序擴充)
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: aiot-timescaledb
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Redis (供 BullMQ 佇列與快取使用)
  redis:
    image: redis:7-alpine
    container_name: aiot-redis
    restart: always
    ports:
      - "6380:6379"

  # 3. EMQX (企業級 MQTT Broker)
  emqx:
    image: emqx/emqx:5.3.0
    container_name: aiot-emqx
    restart: always
    environment:
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DEFAULT_PASSWORD}
    ports:
      - "1883:1883"     # MQTT TCP 埠口
      - "18083:18083"   # EMQX Dashboard 管理後台
    volumes:
      - emqx_data:/opt/emqx/data

  # 4. MinIO (輕量化 S3 物件儲存)
  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: aiot-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"     # S3 API 埠口
      - "9001:9001"     # MinIO Web 控制台
    volumes:
      - minio_data:/data  # 補上持久化 Volume，避免重開容器圖片遺失

  # 5. AI Worker (背景 Redis 佇列處理器)
  ai-worker:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: aiot-ai-worker
    command: python worker.py
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET}
    depends_on:
      - redis
      - timescaledb
      - minio

  # 6. AI API (FastAPI 微服務)
  ai-api:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: aiot-ai-api
    ports:
      - "8000:8000"
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET}
    depends_on:
      - redis
      - timescaledb
      - minio

  # 7. Node.js Backend (Express + Socket.io + MQTT)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiot-backend
    ports:
      - "5002:5002"
    restart: always
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MQTT_BROKER_URL=mqtt://emqx:1883
    depends_on:
      - timescaledb
      - redis
      - emqx

  # 8. React Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiot-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_SOCKET_SERVER_URL=${VITE_SOCKET_SERVER_URL}
      - VITE_MINIO_ENDPOINT=${VITE_MINIO_ENDPOINT}
    depends_on:
      - backend

volumes:
  timescaledb_data:
  minio_data:
  emqx_data: